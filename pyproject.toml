[project]
name = "trufi-data-science"
version = "0.1.0"
description = "Trufi App route query analysis — Cochabamba Metropolitan Area"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "h3>=4.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "folium>=0.17",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "jupyter>=1.1",
    "mobility-db-api>=0.5.1",
    "requests>=2.34.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff.lint.per-file-ignores]
# Stage-1 scripts are frozen reference outputs; legacy lints are tolerated.
"src/01_audit_schema.py" = ["BLE001", "FURB192"]
"src/08_h3_preview.py" = ["BLE001"]
# Stage-2 utility scripts (user-facing CLIs with intentional broad exception handling)
"src/generate_manifest.py" = ["BLE001", "DTZ005"]
"src/gtfs_download.py" = ["BLE001"]
"src/run_update_pipeline.py" = ["DTZ005", "PLW1510"]
"src/trufi_ds/io.py" = ["DTZ005"]
